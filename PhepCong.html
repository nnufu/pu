:root{
  color-scheme:dark;
  --bg1:#040813;--bg2:#0d2150;--panel:#102349;--ink:#f1f6ff;
  --L:#4cc3ff;--R:#ffb347;--S:#5dff9e;--red:#ff5468;
  --d:.95s;--e:cubic-bezier(.65,0,.3,1);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  height:100%;margin:0;overflow:hidden;
  background:radial-gradient(1200px 700px at 50% -15%,var(--bg2),var(--bg1) 70%) var(--bg1);
  color:var(--ink);font-family:"Baloo Offline",system-ui,sans-serif;
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
}
#app{height:100%;display:flex;flex-direction:column;gap:8px;padding:8px 10px 10px}
.dots{display:flex;justify-content:center;gap:10px;height:14px;flex:none}
.dots i{width:14px;height:14px;border-radius:50%;background:#26385f;transition:background .4s}
.dots i.on{background:var(--S)}
#stage{position:relative;flex:1;min-height:0}
#stage.nt,#stage.nt *{transition:none!important}
.box{
  position:absolute;left:0;top:0;border:5px solid;border-radius:30px;
  transition:transform var(--d) var(--e),width var(--d) var(--e),height var(--d) var(--e),border-color .7s,background-color .7s,opacity .7s;
}
#bL{border-color:var(--L);background:rgba(76,195,255,.07)}
#bR{border-color:var(--R);background:rgba(255,179,71,.07)}
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
#bM{border-color:var(--red);background:rgba(255,84,104,.08);--a:0deg;
  -webkit-mask:conic-gradient(from 90deg,#000 var(--a),transparent 0);mask:conic-gradient(from 90deg,#000 var(--a),transparent 0);
  transition:transform var(--d) var(--e),width var(--d) var(--e),height var(--d) var(--e),--a 1.8s ease-in-out}
#bM.on{--a:360deg}
#bL.gone,#bR.gone{opacity:0}
#items,#nums{position:absolute;inset:0;pointer-events:none}
.it{
  position:absolute;left:0;top:0;line-height:1;
  transition:transform var(--d) var(--e),width var(--d) var(--e),height var(--d) var(--e),font-size var(--d) var(--e);
}
.in{
  position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;border-radius:24%;
  opacity:.14;filter:grayscale(1);transition:opacity .5s,filter .5s;
}
.it.L .in{background:rgba(76,195,255,.16)}
.it.R .in{background:rgba(255,179,71,.16)}
.it.on .in{opacity:1;filter:none}
.in.hit{animation:pop .45s}
.in img{width:92%;height:92%;object-fit:contain;pointer-events:none}
.b{
  position:absolute;right:-4%;top:-4%;min-width:1.5em;height:1.5em;padding:0 .3em;border-radius:99px;
  display:flex;align-items:center;justify-content:center;font-size:.32em;font-weight:800;color:#06101f;line-height:1;
  opacity:0;transform:scale(.4);transition:opacity .3s,transform .3s;
}
.b.show{opacity:1;transform:none}
.it.L .b{background:var(--L)}.it.R .b{background:var(--R)}
.n{
  position:absolute;left:0;top:0;display:flex;align-items:center;justify-content:center;
  font-weight:800;line-height:1;white-space:nowrap;opacity:0;
  transition:transform var(--d) var(--e),opacity .5s;
}
.n.on{opacity:1}
.n span{display:block}
.n span.pop{animation:pop .5s}
#nL{color:var(--L)}#nR{color:var(--R)}#nS{color:var(--red)}
#nP,#nE{text-shadow:0 0 28px rgba(255,255,255,.55)}
.bar{flex:none;display:flex;justify-content:center;align-items:center;gap:clamp(8px,2vw,18px);padding-bottom:4px}
.btn{
  width:clamp(48px,8.5vh,76px);height:clamp(48px,8.5vh,76px);flex:none;border-radius:50%;
  border:3px solid #2a4278;background:var(--panel);color:var(--ink);cursor:pointer;
  font-size:clamp(22px,4vh,34px);line-height:1;display:flex;align-items:center;justify-content:center;
  font-family:inherit;padding:0;
}
.btn:active{transform:scale(.92)}
.btn svg{width:52%;height:52%;display:block}
.btn:focus-visible{outline:4px solid #fff;outline-offset:3px}
.btn.go{
  width:clamp(64px,11vh,98px);height:clamp(64px,11vh,98px);background:var(--S);border-color:#b8ffd5;color:#05221a;
  font-size:clamp(30px,5.5vh,50px);animation:beat 1.6s infinite;
}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.22)}100%{transform:scale(1)}}
@keyframes beat{50%{box-shadow:0 0 0 14px rgba(93,255,158,.18)}}
/* cài đặt */
#sheet{position:fixed;inset:0;display:none;background:rgba(3,8,20,.94);z-index:10;overflow:auto;
  padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}
#sheet.open{display:flex;flex-direction:column;align-items:center;gap:14px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:900px}
.side{border:5px solid;border-radius:26px;padding:10px;display:flex;flex-direction:column;gap:10px;background:var(--panel)}
.side.L{border-color:var(--L)}.side.R{border-color:var(--R)}
.side.drag{background:#1d366f}
.eg{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.eg button{
  aspect-ratio:1;border-radius:16px;border:3px solid transparent;background:#0a1530;cursor:pointer;
  font-size:30px;line-height:1;padding:0;display:flex;align-items:center;justify-content:center;color:var(--ink);
}
.eg button.sel{border-color:#fff;background:#1d366f}
.eg img{width:88%;height:88%;object-fit:contain}
.eg button.up{border-style:dashed;border-color:#4a6bb3;color:#4a6bb3;font-size:36px;font-weight:800}
.eg .pic-item{position:relative;aspect-ratio:1;min-width:0}
.eg .pic-item>button:first-child{width:100%;height:100%}
.eg .pic-item>button.del{
  position:absolute;right:-5px;top:-5px;z-index:1;
  width:23px;height:23px;aspect-ratio:auto;border-radius:50%;
  border:2px solid #fff;background:#e3343e;color:transparent;
  font-size:0;line-height:0;padding:0;
  display:grid;place-items:center;
}
.eg .pic-item>button.del::before{
  content:'×';color:#fff;font:700 18px/1 Arial,Helvetica,sans-serif;
  display:block;transform:translateY(-0.5px);
}
.eg .pic-item>button.del:focus-visible{outline:3px solid #fff;outline-offset:2px}
.cnt{display:flex;align-items:center;justify-content:space-between;gap:6px}
.cnt button{width:clamp(44px,12vw,64px);height:clamp(44px,12vw,64px);border-radius:50%;border:3px solid #2a4278;background:#0a1530;color:var(--ink);font-size:30px;font-weight:800;cursor:pointer;padding:0;font-family:inherit}
.cnt b{font-size:clamp(44px,10vw,72px);line-height:1}
.L .cnt b{color:var(--L)}.R .cnt b{color:var(--R)}
@media(max-width:480px){
  .bar{gap:clamp(2px,1vw,7px)}
  .bar .btn:not(.go){width:clamp(35px,10vw,48px);height:clamp(35px,10vw,48px)}
  .bar .btn.go{width:clamp(51px,13vw,64px);height:clamp(51px,13vw,64px)}
}
@media (prefers-reduced-motion:reduce){.in.hit,.n span.pop,.btn.go{animation:none}}

const EMO=['🍎','🍊','🍌','🍓','🍇','🐶','🐱','🐥','🐟','🚗','⚽','🎈','⭐','🌸','🍪','🦋','🍦'];

const S={L:{kind:'e',v:'🍎',n:3},R:{kind:'e',v:'🍊',n:2}};
const gallery=[];
/* Lưu thư viện ảnh cục bộ. Ưu tiên IndexedDB để không bị giới hạn dung lượng localStorage. */
const GALLERY_LOCAL_KEY='HocPhepCong_Anh_Local';
function readLocalGallery(){
  try{
    const saved=JSON.parse(localStorage.getItem(GALLERY_LOCAL_KEY)||'[]');
    return Array.isArray(saved)?saved.filter(x=>typeof x==='string'&&x.startsWith('data:image/')).slice(-16):[];
  }catch(e){return []}
}
function clearLocalGallery(){try{localStorage.removeItem(GALLERY_LOCAL_KEY)}catch(e){}}
function writeLocalGallery(images){
  try{
    if(images.length)localStorage.setItem(GALLERY_LOCAL_KEY,JSON.stringify(images));
    else clearLocalGallery();
    return true;
  }catch(e){console.warn('Trình duyệt không cho lưu ảnh cục bộ.',e);return false}
}
let galleryDB=null, galleryWrite=Promise.resolve();
const galleryReady=new Promise(resolve=>{
  const fallback=()=>{
    gallery.push(...readLocalGallery());
    if($('#sheet').classList.contains('open'))buildSheet();
    resolve(false);
  };
  if(!window.indexedDB){fallback();return}
  let req;
  try{req=indexedDB.open('HocPhepCong_Anh',1)}catch(e){fallback();return}
  req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('gallery'))req.result.createObjectStore('gallery')};
  req.onerror=fallback;
  req.onblocked=fallback;
  req.onsuccess=()=>{
    galleryDB=req.result;
    try{
      const get=galleryDB.transaction('gallery','readonly').objectStore('gallery').get('images');
      get.onsuccess=()=>{
        let migrate=false;
        if(Array.isArray(get.result)){
          gallery.push(...get.result.filter(x=>typeof x==='string'&&x.startsWith('data:image/')).slice(-16));
          clearLocalGallery();
        }else{
          const backup=readLocalGallery();
          if(backup.length){gallery.push(...backup);migrate=true}
        }
        if($('#sheet').classList.contains('open'))buildSheet();
        resolve(true);
        if(migrate)saveGallery().then(ok=>{if(ok)clearLocalGallery()});
      };
      get.onerror=fallback;
    }catch(e){fallback()}
  };
});
function saveGallery(){
  const copy=gallery.slice();
  galleryWrite=galleryWrite.then(async()=>{
    if(!(await galleryReady)||!galleryDB)return writeLocalGallery(copy);
    return await new Promise(resolve=>{
      try{
        const tx=galleryDB.transaction('gallery','readwrite');
        const store=tx.objectStore('gallery');
        if(copy.length)store.put(copy,'images');else store.delete('images');
        tx.oncomplete=()=>resolve(true);
        tx.onerror=()=>{console.warn('Không thể lưu thư viện ảnh vào trình duyệt.',tx.error);resolve(false)};
        tx.onabort=()=>resolve(false);
      }catch(e){console.warn('Không thể lưu thư viện ảnh vào trình duyệt.',e);resolve(false)}
    });
  }).catch(e=>{console.warn('Lỗi lưu ảnh:',e);return false});
  return galleryWrite;
}
async function deleteGalleryImage(url){
  await galleryReady;
  for(let i=gallery.length-1;i>=0;i--)if(gallery[i]===url)gallery.splice(i,1);
  ['L','R'].forEach(side=>{
    if(S[side].kind==='img'&&S[side].v===url){
      S[side]={...S[side],kind:'e',v:side==='L'?'🍎':'🍊'};
    }
  });
  await saveGallery();
  buildSheet();
}

    N.E.classList.add('on');pop(N.E);N.S.classList.add('on');pop(N.S);
    await sleep(400);
    if(alive())await play([FN[a],'cong',FN[b],'bang_may']);
  }else if(t===5){
    await count(items);
  }else{
    await sleep(300);if(!alive())return;
    txt(N.S,tot);pop(N.S);await play([FN[a],'cong',FN[b],'bang',FN[tot]]);
  }
}
function rebuild(){
  token++;step=0;build();
  st.classList.add('nt');place(0);stat(0);chrome(0);void st.offsetWidth;st.classList.remove('nt');
}
$('#bNext').onclick=()=>step>=6?go(0,false):go(step+1,true);
$('#bBack').onclick=()=>{if(step>0)go(step-1,false)};
/* Đổi vị trí hai nhóm hiện có, giữ nguyên DOM để các đồ vật chuyển động mượt. */
$('#bSwap').onclick=()=>{
  if(step<3||step>6)return;
  [S.L,S.R]=[S.R,S.L];
  items.forEach(o=>{
    o.side=o.side==='L'?'R':'L';
    o.el.classList.toggle('L',o.side==='L');
    o.el.classList.toggle('R',o.side==='R');
    o.g=o.side==='L'?o.i:S.L.n+o.i;
  });
  items.sort((a,b)=>a.g-b.g); // bước đếm tiếp theo vẫn đọc từ trái sang phải
  txt(N.L,S.L.n);txt(N.R,S.R.n);
  const current=step;
  go(current,false); // dừng lời đọc/đếm cũ; giữ nguyên bước đang trình chiếu
  play(current===3?[FN[S.L.n],'cong',FN[S.R.n]]:current===6?[FN[S.L.n],'cong',FN[S.R.n],'bang',FN[S.L.n+S.R.n]]:[FN[S.L.n],'cong',FN[S.R.n],'bang_may']);
};
$('#bVoice').onclick=()=>{voice=!voice;$('#bVoice').textContent=voice?'🔊':'🔇';if(!voice)stopAudio();};
$('#bRnd').onclick=()=>{
  const pick=()=>EMO[Math.floor(Math.random()*EMO.length)];
  let x=pick(),y=pick();while(y===x)y=pick();
  const na=1+Math.floor(Math.random()*6),nb=1+Math.floor(Math.random()*Math.min(6,10-na));
  S.L={kind:'e',v:x,n:na};
  S.R={kind:'e',v:y,n:nb};
  rebuild();
};
$('#bSet').onclick=()=>{buildSheet();$('#sheet').classList.add('open')};
$('#bOk').onclick=()=>{$('#sheet').classList.remove('open');rebuild()};

/* Tải ảnh: nhiều ảnh, PNG nền trong suốt được tự cắt sát vật thể */
function proc(file){return new Promise(res=>{
  const r=new FileReader();
  r.onerror=()=>res(null);
  r.onload=()=>{
    const im=new Image();im.onerror=()=>res(null);
    im.onload=()=>{
      const iw=im.naturalWidth||300,ih=im.naturalHeight||300,k=Math.min(1,400/Math.max(iw,ih));
      const w=Math.max(1,Math.round(iw*k)),h=Math.max(1,Math.round(ih*k));
      const c=document.createElement('canvas');c.width=w;c.height=h;
      const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0,w,h);
      let l=w,t=h,rr=-1,bb=-1;
      try{
        const d=x.getImageData(0,0,w,h).data;
        for(let yy=0;yy<h;yy++)for(let xx=0;xx<w;xx++){
          if(d[(yy*w+xx)*4+3]>16){if(xx<l)l=xx;if(xx>rr)rr=xx;if(yy<t)t=yy;if(yy>bb)bb=yy}
        }
      }catch(e){}
      if(rr<0){l=0;t=0;rr=w-1;bb=h-1}
      const tw=rr-l+1,th=bb-t+1,o=document.createElement('canvas');o.width=tw;o.height=th;
      o.getContext('2d').drawImage(c,l,t,tw,th,0,0,tw,th);
      res(o.toDataURL('image/png'));
    };
    im.src=r.result;
  };
  r.readAsDataURL(file);
})}
async function loadFiles(side,files){
  await galleryReady;
  const list=[...files].filter(f=>f.type.startsWith('image/')).slice(0,6);
  const urls=[];
  for(const f of list){const u=await proc(f);if(u){urls.push(u);gallery.push(u)}}
  while(gallery.length>16)gallery.shift();
  const other=side==='L'?'R':'L';
  if(urls[0])S[side]={...S[side],kind:'img',v:urls[0]};
  if(urls[1])S[other]={...S[other],kind:'img',v:urls[1]};
  await saveGallery();
  buildSheet();
}
function buildSheet(){
  ['L','R'].forEach(side=>{
    const box=$('#s'+side);box.innerHTML='';
    const g=document.createElement('div');g.className='eg';
    const add=(kind,v)=>{
      const b=document.createElement('button');
      if(kind==='img'){const i=new Image();i.src=v;b.appendChild(i)}else b.textContent=v;
      if(S[side].kind===kind&&S[side].v===v)b.className='sel';
      b.onclick=()=>{S[side]={...S[side],kind,v};buildSheet()};
      if(kind==='img'){
        const wrap=document.createElement('div');wrap.className='pic-item';
        wrap.appendChild(b);
        const del=document.createElement('button');del.type='button';del.className='del';
        del.textContent='×';del.setAttribute('aria-label','Xóa ảnh khỏi thư viện');
        del.onclick=e=>{e.stopPropagation();deleteGalleryImage(v)};
        wrap.appendChild(del);g.appendChild(wrap);
      }else g.appendChild(b);
    };
    gallery.forEach(u=>add('img',u));
    EMO.forEach(e=>add('e',e));
    const up=document.createElement('button');up.className='up';up.setAttribute('aria-label','Thêm ảnh');
    up.textContent='+';
    const f=document.createElement('input');f.type='file';f.accept='image/png,image/*';f.multiple=true;f.hidden=true;
    f.onchange=()=>loadFiles(side,f.files);
    up.onclick=()=>f.click();
    g.append(up,f);
    const c=document.createElement('div');c.className='cnt';
    const m=document.createElement('button');m.textContent='−';
    const n=document.createElement('b');n.textContent=S[side].n;
    const p=document.createElement('button');p.textContent='+';
    m.onclick=()=>{S[side].n=Math.max(1,S[side].n-1);n.textContent=S[side].n};
    p.onclick=()=>{const o=side==='L'?'R':'L';S[side].n=Math.min(10-S[o].n,S[side].n+1);n.textContent=S[side].n};
    c.append(m,n,p);box.append(g,c);
  });
}
['L','R'].forEach(side=>{
  const box=$('#s'+side);
  box.ondragover=e=>{e.preventDefault();box.classList.add('drag')};
  box.ondragleave=()=>box.classList.remove('drag');
  box.ondrop=e=>{e.preventDefault();box.classList.remove('drag');loadFiles(side,e.dataTransfer.files)};
});

const fsB=$('#bFull'),svg=d=>'<svg viewBox="0 0 24 24" width="58%" height="58%" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="'+d+'"/></svg>';
const I_ON=svg('M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5'),I_OFF=svg('M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5');
const fsEl=document.documentElement,inFS=()=>document.fullscreenElement||document.webkitFullscreenElement;
fsB.innerHTML=I_ON;
if(!(document.fullscreenEnabled||document.webkitFullscreenEnabled))fsB.style.display='none';
fsB.onclick=()=>{try{
  if(inFS())(document.exitFullscreen||document.webkitExitFullscreen).call(document);
  else (fsEl.requestFullscreen||fsEl.webkitRequestFullscreen).call(fsEl);
}catch(e){}};
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{fsB.innerHTML=inFS()?I_OFF:I_ON}));
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{st.classList.add('nt');place(step);void st.offsetWidth;st.classList.remove('nt')},150)});
requestAnimationFrame(rebuild);
</script>
